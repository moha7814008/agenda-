<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda sabbatique</title>
<meta name="theme-color" content="#2F5BEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9F0EF;--surface:#FFFFFF;--soft:#F1F6F5;--ink:#1F2F3F;--muted:#556879;--line:#CFDBDA;
  --accent:#2F5BEA;--accent-ink:#FFFFFF;--accent-soft:#DCE5FF;--ok:#18794E;--warn:#A9461A;--focus:#F2B134;--danger:#B3261E;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13202B;--surface:#1C2B38;--soft:#223341;--ink:#E7EEF3;--muted:#9DB0BF;--line:#2D4151;
    --accent:#86A2FF;--accent-ink:#0F1B2A;--accent-soft:#25365F;--ok:#52C490;--warn:#F0955E;--danger:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#13202B;--surface:#1C2B38;--soft:#223341;--ink:#E7EEF3;--muted:#9DB0BF;--line:#2D4151;
  --accent:#86A2FF;--accent-ink:#0F1B2A;--accent-soft:#25365F;--ok:#52C490;--warn:#F0955E;--danger:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);}
button,input,textarea{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;}
h1{font-size:1.7rem;line-height:1.1;}
h2{font-size:1.3rem;}
h3{font-size:1.05rem;}
p{margin:.4em 0;}
.muted{color:var(--muted);}
.ok{color:var(--ok);font-weight:600;}
.warn{color:var(--warn);font-weight:500;}
.app{max-width:1180px;margin:0 auto;padding:14px 16px 56px;}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 0 12px;}
.sub{margin:.3em 0 0;color:var(--muted);}
.streak{background:var(--focus);color:#1F2F3F;font-weight:700;border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap;}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:2px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:0 16px;}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);}
@media (min-width:900px){
  .grid.day{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start;}
  .grid.mods{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;}
  .grid.mods .wide{grid-column:1/-1;}
}
.col{display:grid;gap:14px;min-width:0;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.row.small{font-size:.9rem;}
.k{font-weight:700;margin:0 0 4px;}
.big{font-family:var(--display);font-size:1.5rem;font-weight:700;margin:.15em 0;}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:baseline;}

/* scène */
.scene{position:relative;aspect-ratio:400/260;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#8fb0c4;}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .7s ease;}
.scene svg.off{opacity:0;pointer-events:none;}
.now-chip{position:absolute;left:10px;top:10px;display:grid;gap:1px;background:rgba(255,255,255,.94);color:#1F2F3F;border-radius:12px;padding:6px 12px;font-size:.85rem;max-width:70%;}
.now-chip span{color:#4A5C6C;}
.hint{position:absolute;left:10px;bottom:8px;background:rgba(255,255,255,.88);color:#34495B;border-radius:999px;padding:3px 10px;font-size:.72rem;}
.zz{animation:zfloat 2.4s ease-in-out infinite;}
.zz2{animation:zfloat 2.4s ease-in-out .8s infinite;}
@keyframes zfloat{0%,100%{opacity:.2;transform:translateY(4px);}50%{opacity:1;transform:translateY(-3px);}}
.bob{animation:bob .6s ease-in-out infinite alternate;}
@keyframes bob{from{transform:translateY(0);}to{transform:translateY(-5px);}}
.legA,.legB,.armA,.armB{transform-box:fill-box;transform-origin:50% 0;}
.legA{animation:swA .5s ease-in-out infinite alternate;}
.legB{animation:swB .5s ease-in-out infinite alternate;}
.armA{animation:swB .5s ease-in-out infinite alternate;}
.armB{animation:swA .5s ease-in-out infinite alternate;}
.slow{animation-duration:.9s!important;}
@keyframes swA{from{transform:rotate(28deg);}to{transform:rotate(-28deg);}}
@keyframes swB{from{transform:rotate(-28deg);}to{transform:rotate(28deg);}}

/* contrôles */
.ctrl{display:flex;align-items:center;gap:10px;}
.ctrl input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:32px;}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.btns.pad{margin-top:14px;}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px;}
.btn.alt{background:var(--accent-soft);color:var(--ink);}
.btn.danger{background:var(--danger);color:#fff;}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem;}
.btn:active{transform:translateY(1px);}
.ghost{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 6px;}
.tag{font-size:.75rem;color:var(--warn);font-weight:700;}
.focus .row{margin-bottom:6px;}
.timer{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums;}
.next{border-left:5px solid var(--accent);}
.plain{list-style:none;margin:.4em 0;padding:0;display:grid;gap:4px;}
.plain li{display:flex;align-items:center;justify-content:space-between;gap:8px;}

/* chronologie */
.tl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;}
.tl-i{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-left:5px solid var(--line);background:var(--soft);border-radius:0 8px 8px 0;}
.tl-i.now{background:var(--accent-soft);outline:2px solid var(--focus);}
.tl-i.missed{opacity:.6;}
.tl-i.done .tl-l{text-decoration:line-through;opacity:.7;}
.tl-t{font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--muted);}
.tl-l small{color:var(--muted);}
.dur{font-size:.8rem;color:var(--muted);}
.chk{border:1.5px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.82rem;cursor:pointer;min-height:32px;}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff;}
.top3 ol{margin:.2em 0 0;padding-left:20px;}
.top3 li{margin:2px 0;}

.tl-btn{background:none;border:0;padding:0;text-align:left;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:underline dotted var(--muted);text-underline-offset:4px;}
.tl-act{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 2px;}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0;}
.fld.col{flex-direction:column;align-items:stretch;gap:4px;margin:0;}
.fld.col span{font-size:.85rem;color:var(--muted);}
select{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%;}
.fld.col input[type=text],.fld.col input[type=time]{width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;}
.btns.tight{margin:0;gap:2px;}
.plain.ev li{align-items:flex-start;flex-wrap:wrap;}
.daily{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;}

.chipcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.streak.alt{background:var(--accent-soft);color:var(--ink);}
.why{margin:0;padding:10px 14px;border-left:5px solid var(--focus);background:var(--surface);border-radius:0 10px 10px 0;font-family:var(--display);font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--ink);}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;}
.seg button{background:var(--soft);border:0;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--ink);min-height:40px;}
.seg button.on{background:var(--accent);color:var(--accent-ink);}
.bilan summary{cursor:pointer;font-weight:700;font-family:var(--display);font-size:1.05rem;}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:8px;}
.bcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;}
.bstack{position:relative;flex:1;width:100%;max-width:38px;}
.bstack i{position:absolute;left:0;right:0;bottom:0;border-radius:4px 4px 0 0;display:block;}
.bstack .pl{background:var(--accent-soft);}
.bstack .dn{background:var(--accent);}
.bcol span{font-size:.75rem;font-weight:700;}
.bcol small{font-size:.66rem;color:var(--muted);}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,16px);grid-auto-columns:minmax(0,1fr);gap:4px;max-width:420px;}
.hc{display:block;border-radius:3px;background:var(--soft);border:1px solid var(--line);}
.hc.l1{background:#B9D3FF;border-color:#B9D3FF;}
.hc.l2{background:#6F96F0;border-color:#6F96F0;}
.hc.l3{background:#2F5BEA;border-color:#2F5BEA;}
.hc.lf{opacity:.35;}
.flash{text-align:center;}
.fcard{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:22px 12px;margin:10px 0;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
.ff{font-family:var(--display);font-size:1.7rem;font-weight:700;overflow-wrap:anywhere;}
.ff.arab{font-size:4.2rem;line-height:1.2;font-weight:400;}
.fb{font-size:1.1rem;color:var(--ink);}
.flash .btns{justify-content:center;}
textarea{font:inherit;}
input[type=color]{padding:2px;height:40px;width:64px;background:var(--soft);border:1px solid var(--line);border-radius:8px;}
input[type=date]{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;}
.card.inner{background:var(--soft);margin-top:12px;}
.lvl{color:var(--accent);margin:6px 0 0;}

/* semaine */
.wk-wrap{overflow-x:auto;}
.wk{display:grid;grid-template-columns:44px repeat(7,minmax(104px,1fr));min-width:780px;}
.wk-ax{position:relative;}
.wk-ax span{position:absolute;right:6px;font-size:.72rem;color:var(--muted);transform:translateY(-50%);}
.wk-c{border-left:1px solid var(--line);}
.wk-c.today .wk-h{color:var(--accent);}
.wk-h{height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.wk-b{position:relative;}
.wk-k{position:absolute;left:2px;right:2px;border:0;border-left:4px solid;border-radius:4px;padding:1px 4px;text-align:left;font-size:.72rem;line-height:1.15;overflow:hidden;color:var(--ink);cursor:pointer;display:block;}
.wk-k small{display:block;color:var(--muted);font-size:.66rem;}
.wk-k.done{opacity:.55;}
.wk-k.missed{opacity:.4;}

/* modules */
.bar{display:block;position:relative;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0;}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;flex-wrap:wrap;}
.fld-in{display:inline-flex;align-items:center;gap:6px;}
.fld input,.add input,textarea{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;min-width:0;}
.fld input[type=text]{width:90px;text-align:right;}
.fld-in input[type=time]{width:auto;}
.fld em{font-style:normal;color:var(--muted);}
.road{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
.road summary{cursor:pointer;font-weight:600;}
.cb{display:inline-flex;align-items:center;gap:8px;cursor:pointer;}
.cb input{width:18px;height:18px;accent-color:var(--accent);}
.add{display:flex;gap:8px;margin:10px 0;}
.add input{flex:1;}
.add.two{flex-wrap:wrap;}
.add.two input:first-child{flex:0 0 130px;}
textarea{width:100%;resize:vertical;margin-top:8px;}
.shifts{display:grid;gap:6px;margin-top:8px;}
.shift{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);}
.shift .cb{min-width:110px;font-weight:600;}
.tin{display:inline-flex;align-items:center;gap:6px;}
.tin input{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 8px;}
.days{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0;}
.spark{width:100%;height:70px;margin:6px 0;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw;z-index:20;}

@media (max-width:560px){
  h1{font-size:1.45rem;}
  .tl-i{grid-template-columns:82px minmax(0,1fr) auto;}
  .timer{font-size:2.6rem;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function(){
'use strict';
const {useState,useEffect,useMemo,useCallback}=React;
const h=React.createElement;

/* ---------- constantes ---------- */
const KEY='agenda-sabbatique-v1';
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>{if(m>=1440)return '24:00';m=Math.max(0,Math.round(m));return pad(Math.floor(m/60))+':'+pad(m%60);};
const toT=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const fromT=s=>{const a=String(s).split(':').map(Number);return (a[0]||0)*60+(a[1]||0);};
const durL=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):''):m+' min';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
const frDate=iso=>iso.slice(8,10)+'/'+iso.slice(5,7);

const BASE_STUDY=[
 {id:'maths',nom:'Maths',quota:300,len:50,energy:'high',color:'#2F5BEA',niveau:'Départ : niveau 1re, début de Terminale',note:'Remise à niveau de la 1re d’abord, puis la Terminale : 20 min de cours, 30 min d’exercices chronométrés.'},
 {id:'physique',nom:'Physique',quota:240,len:45,energy:'high',color:'#8A4FD6',niveau:'Départ : niveau seconde',note:'Un chapitre à la fois : cours, formules à connaître, puis 5 exercices simples.'},
 {id:'svt',nom:'SVT',quota:150,len:50,energy:'high',color:'#1E9E6A',niveau:'Terminale déjà vue, beaucoup oublié',note:'Relecture active du cours, un schéma-bilan, puis des questions de cours.'},
 {id:'arabe',nom:'Arabe littéraire',quota:240,len:30,energy:'high',color:'#D9822B',niveau:'Débutant : alphabet',note:'Séances courtes et fréquentes : lettres, sons, écriture, puis lecture de syllabes.'},
 {id:'anglais',nom:'Anglais',quota:180,len:40,energy:'low',color:'#1B9AAA',niveau:'Niveau A2, objectif B1',note:'Grammaire de base, 10 mots nouveaux, écoute de contenus lents, un court texte à écrire.'},
 {id:'coran',nom:'Coran',quota:180,len:40,energy:'low',color:'#C2477A',niveau:'',note:'Nouveau passage, révision de ce qui est appris, tajwid.'},
 {id:'revenus',nom:'Revenus en ligne',quota:300,len:60,energy:'high',color:'#C99A06',niveau:'',note:'Un seul projet à la fois : produire, publier, mesurer.'}
];
const STUDY=BASE_STUDY.slice();
const DAILY=[
 {id:'menage',nom:'Ménage',color:'#6F8294',note:'30 minutes, une zone par jour.'},
 {id:'culture',nom:'Culture générale',color:'#D1495B',note:'25 minutes sur le domaine de la semaine.'},
 {id:'sport',nom:'Sport',color:'#E4572E',note:'Séance douce, progressive.'}
];
const MOD={};STUDY.concat(DAILY).forEach(m=>MOD[m.id]=m);
const BASE_LOOK={};STUDY.concat(DAILY).forEach(m=>{BASE_LOOK[m.id]={nom:m.nom,color:m.color};});
function syncCustom(S){
 STUDY.length=BASE_STUDY.length;
 (S.customMods||[]).forEach(c=>{
  const m={id:c.id,nom:c.nom||'Module',quota:c.quota||120,len:c.len||40,energy:c.energy||'any',color:c.color||'#7A8B99',niveau:'',note:c.note||'Module personnalisé.',custom:true};
  BASE_LOOK[c.id]={nom:m.nom,color:m.color};
  STUDY.push(m);MOD[c.id]=m;
 });
 STUDY.concat(DAILY).forEach(m=>{

  m.nom=o.nom||BASE_LOOK[m.id].nom;m.color=o.color||BASE_LOOK[m.id].color;
 });
}
const ARABIC=[['ا','Alif','« aa » long, ou support de la voyelle'],['ب','Bā’','b'],['ت','Tā’','t'],['ث','Thā’','« th » de « think »'],['ج','Jīm','j'],['ح','Ḥā’','h soufflé, du fond de la gorge'],['خ','Khā’','« kh », comme la jota espagnole'],['د','Dāl','d'],['ذ','Dhāl','« th » de « this »'],['ر','Rā’','r roulé'],['ز','Zāy','z'],['س','Sīn','s'],['ش','Shīn','« ch » de « chat »'],['ص','Ṣād','s emphatique (grave)'],['ض','Ḍād','d emphatique (grave)'],['ط','Ṭā’','t emphatique (grave)'],['ظ','Ẓā’','« dh » emphatique (grave)'],['ع','ʿAyn','son guttural, propre à l’arabe'],['غ','Ghayn','« gh », proche du r français'],['ف','Fā’','f'],['ق','Qāf','q, un k du fond de la gorge'],['ك','Kāf','k'],['ل','Lām','l'],['م','Mīm','m'],['ن','Nūn','n'],['ه','Hā’','h léger'],['و','Wāw','w, ou « ou » long (ū)'],['ي','Yā’','y, ou « i » long (ī)']];
const INTERVALS=[0,1,2,4,8,16,32];
const ZONES=['Chambre','Salle de bain','Cuisine','Salon et entrée','Linge','Frigo et courses','Grand rangement'];
const TYPE_COL={sleep:'#5B5BA6',work:'#5A6B7B',prep:'#8A99A8',routine:'#A0907A',meal:'#C48A4A',pause:'#7FB59B',libre:'#B8C4C2',imprevu:'#C0504D',event:'#7A5CC9',todo:'#D9822B'};

 const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());

const icsEsc=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsDate(iso,m){let d=iso;if(m>=1440){d=addDays(iso,1);m-=1440;}return d.replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';}
function buildICS(plan,weekIso,o){
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agenda sabbatique//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Agenda sabbatique','X-WR-TIMEZONE:Europe/Paris'];
 const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 plan.days.forEach((dd,d)=>{
  const iso=addDays(weekIso,d);
  dd.blocks.forEach(b=>{
   if(b.missed)return;
   const t=b.type;
   const ok=((t==='task'||t==='todo')&&o.study)||((t==='event'||t==='imprevu')&&o.events)||(t==='work'&&o.work)||((t==='routine'||t==='meal')&&o.rest);
   if(!ok)return;
   L.push('BEGIN:VEVENT','UID:'+['ag',weekIso,d,b.s,t,b.mod||'x'].join('-')+'@agenda-sabbatique','DTSTAMP:'+stamp,'DTSTART:'+icsDate(iso,b.s),'DTEND:'+icsDate(iso,b.e),'SUMMARY:'+icsEsc(b.label));
   if(o.alarm>=0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(b.label),'TRIGGER:'+(o.alarm>0?'-PT'+Math.round(o.alarm)+'M':'PT0S'),'END:VALARM');
   L.push('END:VEVENT');
  });
 });
 L.push('END:VCALENDAR');
 return L.join('\r\n')+'\r\n';
}

/* ---------- moteur de planification ---------- */
function wakeOf(d,S,evts){
 let w=S.wakeCap;const sh=S.shifts[d];
 if(sh)w=Math.min(w,sh[0]-S.prep-S.commute);
 (evts||[]).forEach(e=>{if(e.d===d&&e.kind!=='libre'&&e.kind!=='imprevu')w=Math.min(w,e.s-(e.tb||0)-S.prep);});
 return Math.max(0,w);
}
function bedOf(d,S,evts){
 const n=(d+1)%7;
 let b=Math.min(1440,1440+wakeOf(n,S,evts)-Math.round(S.sleepH*60));
 (evts||[]).forEach(e=>{if(e.d===d&&e.kind!=='libre'&&e.kind!=='imprevu')b=Math.max(b,Math.min(1440,e.e+(e.ta||0)+S.eve));});
 const sh=S.shifts[d];
 if(sh)b=Math.max(b,Math.min(1440,sh[1]+S.commute+S.eve));
 return Math.max(b,wakeOf(d,S,evts)+120);
}
function carve(free,s,e){
 const out=[],pieces=[];
 for(const iv of free){
  const a=iv[0],b=iv[1];
  if(e<=a||s>=b){out.push([a,b]);continue;}
  const ia=Math.max(a,s),ib=Math.min(b,e);
  pieces.push([ia,ib]);
  if(a<ia)out.push([a,ia]);
  if(ib<b)out.push([ib,b]);
 }
 return {free:out,pieces:pieces};
}
const fits=(free,s,e)=>free.some(iv=>iv[0]<=s&&e<=iv[1]);
function findSpot(free,dur,win,late){
 const w0=win?win[0]:0,w1=win?win[1]:1440;
 const list=late?free.slice().reverse():free;
 for(const iv of list){
  const lo=Math.max(iv[0],w0),hi=Math.min(iv[1],w1);
  if(hi-lo>=dur)return late?hi-dur:lo;
 }
 return null;
}
function planDay(d,S,rem,o){
 const from=o.from||0,prev=o.prev||[],isDone=o.done||function(){return false;},evts=o.evts||[];
 const evs=evts.filter(e=>e.d===d);
 const sh=S.shifts[d],wake=wakeOf(d,S,evts),bed=bedOf(d,S,evts),M=S.meals;
 const blocks=[];let free=[[0,1440]];
 const take=(s,e,p)=>{
  s=Math.max(0,s);e=Math.min(1440,e);if(e<=s)return;
  const r=carve(free,s,e);free=r.free;
  r.pieces.forEach(pc=>{if(pc[1]>pc[0])blocks.push(Object.assign({},p,{s:pc[0],e:pc[1],d:d}));});
 };
 take(0,wake,{type:'sleep',label:'Sommeil',scene:'sleep'});
 take(bed,1440,{type:'sleep',label:'Sommeil',scene:'sleep'});
 /* rendez-vous, imprévus et séances placées à la main : priorité sur tout sauf le sommeil */
 evs.forEach(e=>{
  if(e.tb>0)take(e.s-e.tb,e.s,{type:'prep',label:'Trajet : '+(e.title||'rendez-vous'),scene:'walkTo'});
  if(e.kind==='seance'&&MOD[e.mod]){
   const scn=e.mod==='sport'?(S.sportHome?'sporthome':'run'):e.mod==='menage'?'clean':'desk';
   take(e.s,e.e,{type:'task',mod:e.mod,label:MOD[e.mod].nom,scene:scn,pin:true,evId:e.id});
  }else{
   take(e.s,e.e,{type:'event',kind:e.kind,label:e.title||EVK[e.kind]||'Événement',scene:e.kind==='libre'?'bed':(e.loc==='dehors'?'out':'desk'),color:e.color||EVC[e.kind]||'#7A5CC9',mod:'ev'+e.id,evId:e.id});
  }
  if(e.ta>0)take(e.e,e.e+e.ta,{type:'prep',label:'Retour : '+(e.title||'rendez-vous'),scene:'walkBack'});
 });
 blocks.forEach(b=>{if(b.pin&&b.e<=from&&!isDone(b))b.missed=true;});
 if(sh){
  take(sh[0],sh[1],{type:'work',label:S.workName||'Travail',scene:'work'});
  take(sh[0]-S.commute,sh[0],{type:'prep',label:'Trajet vers le travail',scene:'walkTo'});
  take(sh[1],sh[1]+S.commute,{type:'prep',label:'Retour à la maison',scene:'walkBack'});
 }
 take(wake,wake+S.prep,{type:'routine',label:'Réveil et routine du matin',scene:'armoire'});
 take(bed-S.eve,bed,{type:'routine',label:'Routine du soir',scene:'armoire'});
 const meal=(c,label)=>{for(const s of c){if(fits(free,s,s+M.dur)){take(s,s+M.dur,{type:'meal',label:label,scene:'meal'});return;}}};
 meal([M.lunch,M.lunch-30,M.lunch+30,M.lunch+60,M.lunch-75,M.lunch-105],'Déjeuner');
 meal([M.dinner,M.dinner-30,M.dinner+30,M.dinner-60,M.dinner-90],'Dîner');
 /* imprévu annoncé aujourd'hui */
 const drop=o.x&&o.x.drop;
 if(o.x&&o.x.add)take(o.x.add.s,o.x.add.e,{type:'imprevu',label:'Imprévu',scene:'bed'});
 /* blocs conservés lors d'une replanification */
 prev.forEach(p=>{
  if(p.type==='imprevu'){const r0=carve(free,p.s,p.e);free=r0.free;blocks.push(p);return;}
  if(p.pin)return;
  if(['task','todo','pause','libre'].indexOf(p.type)<0||p.s>=from)return;
  if(drop&&p.s>=drop[0]&&p.s<drop[1])return;
  let q;
  if(p.type==='task'||p.type==='todo'){
   q=Object.assign({},p);
   if(drop&&p.s<drop[0]&&p.e>drop[0]){q.e=drop[0];if(!isDone(p))q.missed=true;}
   else if(!isDone(p)&&!(p.e>from))q.missed=true;
  }else{
   const cut=drop?drop[0]:from;
   q=p.e>cut?Object.assign({},p,{e:cut}):p;
  }
  const r=carve(free,q.s,q.e);free=r.free;
  const got=r.pieces.reduce((a,pc)=>a+pc[1]-pc[0],0);
  if(got>=q.e-q.s-1||(q.type==='task'&&isDone(q)))blocks.push(q);
 });
 if(from>0)free=free.map(iv=>[Math.max(iv[0],from),iv[1]]).filter(iv=>iv[1]-iv[0]>0);
 /* activités quotidiennes (durée, créneau et jours réglables) */
 const have={};blocks.forEach(b=>{if(b.type==='task'&&!b.missed)have[b.mod]=1;});
 [['sport',false,S.sportHome?'sporthome':'run'],['menage',false,'clean'],['culture',true,'desk']].forEach(t=>{
  const id=t[0],dc=S.daily[id];
  if(dc.days.indexOf(d)<0||have[id]||dc.dur<5)return;
  const win=[dc.from,dc.to];
  let st=findSpot(free,dc.dur,win,t[1]);
  if(st===null)st=findSpot(free,dc.dur,null,t[1]);
  if(st===null)return;
  take(st,st+dc.dur,{type:'task',mod:id,label:MOD[id].nom,scene:t[2]});
 });
 /* blocs d'étude */
 const weekend=d>=5,capMul=(S.capMul&&S.capMul[d]!==undefined)?S.capMul[d]:1,cap=Math.round((weekend?S.weekendCap:S.weekdayCap)*capMul);
 let used=0;const cnt={};
 blocks.forEach(b=>{if(b.type==='task'&&!b.missed&&rem[b.mod]!==undefined){used+=b.e-b.s;cnt[b.mod]=(cnt[b.mod]||0)+1;}});
 let last=null;
 free.map(iv=>iv.slice()).forEach(iv=>{
  let t=iv[0];const end=iv[1];
  while(end-t>=25&&cap-used>=15){
   const early=t<1020;
   const c=STUDY.filter(m=>{const ms=S.mods[m.id];return rem[m.id]>=15&&ms.days.indexOf(d)>=0&&(cnt[m.id]||0)<ms.max&&m.id!==last;});
   if(!c.length)break;
   const sc=m=>{const en=S.mods[m.id].energy;return rem[m.id]+(en==='any'?75:(((en==='high')===early)?150:0));};
   c.sort((a,b)=>sc(b)-sc(a));
   const m=c[0],len=Math.min(S.mods[m.id].len,rem[m.id],end-t,cap-used);
   if(len<15)break;
   take(t,t+len,{type:'task',mod:m.id,label:m.nom,scene:'desk'});
   rem[m.id]-=len;used+=len;cnt[m.id]=(cnt[m.id]||0)+1;last=m.id;t+=len;
   if(cap-used>=15&&end-t>=30){const pz=Math.min(S.pomoBreak,end-t);take(t,t+pz,{type:'pause',label:'Pause',scene:'bed'});t+=pz;}
  }
 });
 free.forEach(iv=>{if(iv[1]-iv[0]>=15)blocks.push({d:d,s:iv[0],e:iv[1],type:'libre',label:'Temps libre',scene:'bed'});});
 blocks.sort((x,y)=>x.s-y.s||x.e-y.e);
 return {d:d,wake:wake,bed:bed,blocks:blocks};
}
function placeTodos(days,S,todos,from){
 const list=todos.filter(t=>!t.done).slice().sort((a,b)=>{
  const da=(a.due===null||a.due===undefined)?9:a.due,db=(b.due===null||b.due===undefined)?9:b.due;
  return da-db||(b.prio-a.prio)||(a.dur-b.dur);
 });
 const used=days.map(dd=>dd.blocks.filter(b=>b.type==='todo'&&!b.missed).reduce((a,b)=>a+b.e-b.s,0));
 const un=[];
 list.forEach(t=>{
  let ok=false;
  const d0=from?Math.min(from.d,6):0;
  for(let d=d0;d<7&&!ok;d++){
   if(t.due!==null&&t.due!==undefined&&d>t.due)break;
   const capd=d>=5?S.todoCapWe:S.todoCapWd;
   if(used[d]+t.dur>capd)continue;
   const bl=days[d].blocks;
   for(let pass=0;pass<2&&!ok;pass++)for(let i=0;i<bl.length&&!ok;i++){
    const b=bl[i];
    if(b.type!=='libre')continue;
    const lo=Math.max(b.s,(from&&d===from.d)?from.m:0);
    if(b.e-lo<t.dur)continue;
    if(pass===0&&lo+t.dur>1290)continue;
    const nb=[];
    if(lo-b.s>=15)nb.push(Object.assign({},b,{e:lo}));
    nb.push({d:d,s:lo,e:lo+t.dur,type:'todo',mod:'t'+t.id,tid:t.id,label:t.title,scene:'desk'});
    if(b.e-(lo+t.dur)>=15)nb.push(Object.assign({},b,{s:lo+t.dur}));
    bl.splice.apply(bl,[i,1].concat(nb));
    used[d]+=t.dur;ok=true;
   }
  }
  if(!ok)un.push(t.id);
 });
 return un;
}
function buildPlan(S,prevPlan,isDone,from,x,ctx){
 const evts=(ctx&&ctx.evts)||[],todos=(ctx&&ctx.todos)||[];
 const rem={};STUDY.forEach(m=>rem[m.id]=Math.max(0,+S.quota[m.id]||0));
 const days=[];
 evts.forEach(e=>{
  if(e.kind!=='seance'||rem[e.mod]===undefined)return;
  const past=from&&(e.d<from.d||(e.d===from.d&&e.e<=from.m));
  if(past&&!isDone({d:e.d,s:e.s,type:'task',mod:e.mod}))return;
  rem[e.mod]=Math.max(0,rem[e.mod]-(e.e-e.s));
 });
 if(!from){
  [5,6,0,1,2,3,4].forEach(d=>{days[d]=planDay(d,S,rem,{evts:evts});});
 }else{
  for(let d=0;d<=from.d&&d<7;d++){
   const lim=d<from.d?1440:from.m;
   prevPlan.days[d].blocks.forEach(b=>{
    if(b.pin)return;
    if(x&&x.drop&&d===from.d&&b.s>=x.drop[0]&&b.s<x.drop[1])return;
    if(b.type==='task'&&rem[b.mod]!==undefined&&b.s<lim&&(isDone(b)||b.e>lim))rem[b.mod]=Math.max(0,rem[b.mod]-(b.e-b.s));
   });
  }
  for(let d=0;d<7;d++){
   days[d]=planDay(d,S,rem,{from:d<from.d?1440:d===from.d?from.m:0,prev:d<=from.d?prevPlan.days[d].blocks:[],done:isDone,x:d===from.d?x:null,evts:evts});
  }
 }
 const unT=placeTodos(days,S,todos,from);
 return {days:days,rem:rem,unT:unT};
}
function blockAt(plan,d,m){
 const bs=plan.days[d].blocks;
 let f=null;
 for(const b of bs){if(b.s<=m&&m<b.e){if(!b.missed)return b;f=f||b;}}
 return f;
}

const SKY=[[0,'#0D1736','#1B2B5A'],[6,'#17235A','#3B467E'],[7.25,'#6A8FD0','#F5B98A'],[8.75,'#7DB8EA','#C4E5F6'],[16.5,'#7DB8EA','#C4E5F6'],[17.75,'#6C8BCB','#F4A97B'],[19,'#2B3A78','#7D5E94'],[20.5,'#0D1736','#1B2B5A'],[24,'#0D1736','#1B2B5A']];
const hexv=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hexv(a),B=hexv(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
function sky(hh){
 for(let i=0;i<SKY.length-1;i++){
  const a=SKY[i],b=SKY[i+1];
  if(hh>=a[0]&&hh<=b[0]){const t=(hh-a[0])/((b[0]-a[0])||1);return [mix(a[1],b[1],t),mix(a[2],b[2],t)];}
 }
 return [SKY[0][1],SKY[0][2]];
}
function night(hh){if(hh<6||hh>=20)return 1;if(hh<8)return 1-(hh-6)/2;if(hh<17)return 0;return (hh-17)/3;}
function body(hh){
 if(hh>=7&&hh<18)return {sun:true,p:(hh-7)/11};
 const t=hh>=18?hh-18:hh+6;
 return {sun:false,p:Math.min(1,t/13)};
}

function nextTask(plan,pos,done){
 const all=[];
 plan.days.forEach(dd=>dd.blocks.forEach(b=>{if((b.type==='task'||b.type==='todo')&&!b.missed&&!done[blockKey(b)])all.push(b);}));
 const cur=all.find(b=>b.d===pos.d&&b.s<=pos.m&&pos.m<b.e);
 if(cur)return {b:cur,now:true};
 const nx=all.find(b=>b.d>pos.d||(b.d===pos.d&&b.s>=pos.m));
 return nx?{b:nx,now:false}:null;
}
